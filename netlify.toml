[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route the existing same-origin API path to the function.
# force = true so this wins over the SPA catch-all in public/_redirects.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
